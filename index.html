      const LS = {
        get: (k, d) => {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : d;
          } catch {
            return d;
          }
        },
        set: (k, v) => {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch {}
        },
      };
      const DB = "europaFinal";
      function openDB() {
        return new Promise((r, j) => {
          const q = indexedDB.open(DB, 1);
          q.onerror = () => j(q.error);
          q.onsuccess = () => r(q.result);
          q.onupgradeneeded = (e) => {
            if (!e.target.result.objectStoreNames.contains("files"))
              e.target.result.createObjectStore("files", { keyPath: "id" });
          };
        });
      }
      async function dbSave(o) {
        const db = await openDB();
        return new Promise((r, j) => {
          const t = db.transaction("files", "readwrite");
          t.objectStore("files").put(o);
          t.oncomplete = r;
          t.onerror = () => j(t.error);
        });
      }
      async function dbGet(id) {
        const db = await openDB();
        return new Promise((r, j) => {
          const t = db.transaction("files", "readonly");
          const q = t.objectStore("files").get(id);
          q.onsuccess = () => r(q.result);
          q.onerror = () => j(q.error);
        });
      }
      async function dbDel(id) {
        const db = await openDB();
        return new Promise((r, j) => {
          const t = db.transaction("files", "readwrite");
          t.objectStore("files").delete(id);
          t.oncomplete = r;
          t.onerror = () => j(t.error);
        });
      }

      const fmt = (n, cur, rate, rateUSD, extraRates) => {
        if (!n && n !== 0) return "—";
        const v = parseFloat(n) || 0;
        if (cur === "EUR")
          return `€${v.toLocaleString("es", { maximumFractionDigits: 0 })}`;
        if (cur === "USD")
          return `US$${(v * (rateUSD || 1.08)).toLocaleString("es", { maximumFractionDigits: 0 })}`;
        if (cur !== "COP" && extraRates && extraRates[cur])
          return `${cur} ${(v / extraRates[cur]).toLocaleString("es", { maximumFractionDigits: 2 })}`;
        return `$${(v * rate).toLocaleString("es", { maximumFractionDigits: 0 })}`;
      };

          city: "",
          category: "Comida",
          amount: "",
          currency: "EUR",
          description: "",

        const upd = (k, v) => setForm((p) => ({ ...p, [k]: v }));
        const cats = Object.keys(CAT_COLORS);
        const cities = [
          "General",
          ...itin.filter((c) => c.city.indexOf("Ferry") < 0).map((c) => c.city),
        ];
        const filtered =
          filter === "Todos" ? exp : exp.filter((e) => e.category === filter);
        const total = filtered.reduce((s, e) => {
          const v = parseFloat(e.amount) || 0;
          return s + (e.currency === "EUR" ? v : v / rate);
        }, 0);
        const groupByCat = useMemo(() => {
          const g = {};
          exp.forEach((e) => {

      // ══════════════════ BUDGET ══════════════════
      function BudTab({ bud, setBud, exp, itin, cur, rate, rateUSD }) {
        const [ed, setEd] = useState(null);
        const [form, setForm] = useState({});
        const [editCur, setEditCur] = useState("EUR");
        const getSpent = (n) =>
          exp
            .filter((e) => e.city === n)
            .reduce((s, e) => {
              const v = parseFloat(e.amount) || 0;
              return s + (e.currency === "EUR" ? v : v / rate);
            }, 0);

        const eurToDisplay = (eurVals, toCur) =>
          Object.fromEntries(
            Object.entries(eurVals).map(([k, v]) => [
              k,
              toCur === "COP" ? Math.round(v * rate) : v,
            ]),
          );

        const openEd = (id) => {
          const b = bud[id] || {
            accom: 0,
            transport: 0,
            food: 0,
            activities: 0,
            misc: 0,
          };
          const c = cur === "USD" ? "EUR" : cur;
          setEditCur(c);
          setForm(eurToDisplay(b, c));
          setEd(id);
        };

        const changeEditCur = (newCur) => {
          if (newCur === editCur) return;
          setForm((p) =>
            Object.fromEntries(
              Object.entries(p).map(([k, v]) => [
                k,
                newCur === "COP"
                  ? Math.round((parseFloat(v) || 0) * rate)
                  : Math.round((parseFloat(v) || 0) / rate),
              ]),
            ),
          );
          setEditCur(newCur);
        };

        const save = () => {
          const eurForm =
            editCur === "COP"
              ? Object.fromEntries(
                  Object.entries(form).map(([k, v]) => [
                    k,
                    Math.round((parseFloat(v) || 0) / rate),
                  ]),
                )
              : Object.fromEntries(
                  Object.entries(form).map(([k, v]) => [k, parseFloat(v) || 0]),
                );
          setBud((p) => ({ ...p, [ed]: eurForm }));
          setEd(null);
        };

        const upd = (k, v) => setForm((p) => ({ ...p, [k]: v }));
        const formTotal = Object.values(form).reduce(
          (s, v) => s + (parseFloat(v) || 0),
          0,
        );
        const formTotalEUR = editCur === "COP" ? formTotal / rate : formTotal;
        const edCity = ed !== null ? itin.find((c) => c.id === ed) : null;

        const cities = itin.filter((c) => c.nights > 0);
        const grandBud = Object.values(bud).reduce(
          (s, b) => s + budgetTotal(b),
          0,
        );
        const grandSpent = exp.reduce((s, e) => {
          const v = parseFloat(e.amount) || 0;
          return s + (e.currency === "EUR" ? v : v / rate);
        }, 0);
        const pct =
          grandBud > 0 ? Math.min(100, (grandSpent / grandBud) * 100) : 0;

        return html`<div>
          <div class="page-header" style="padding-top:8px">
            <div class="page-title">📊 Presupuesto</div>
          </div>
          <div class="card">
            <div
              style="display:flex;justify-content:space-between;margin-bottom:8px"
            >
              <div>
                <div style="font-size:12px;color:var(--text3)">
                  Total estimado
                </div>
                <div style="font-size:20px;font-weight:800;color:var(--blue)">
                  ${fmt(grandBud, cur, rate, rateUSD)}
                </div>
              </div>
              <div style="text-align:right">
                <div style="font-size:12px;color:var(--text3)">
                  Total gastado
                </div>
                <div style="font-size:20px;font-weight:800;color:var(--amber)">
                  ${fmt(grandSpent, cur, rate, rateUSD)}
                </div>
              </div>
            </div>
            <div class="progress-bar">
              <div
                class="progress-fill"
                style=${"width:" +
                pct +
                "%;background:" +
                (pct < 60
                  ? "var(--green)"
                  : pct < 85
                    ? "var(--amber)"
                    : "var(--red)")}
              ></div>
            </div>
            <div
              style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text3)"
            >
              <span>${pct.toFixed(1)}% utilizado</span
              ><span
                >Disponible:
                ${fmt(grandBud - grandSpent, cur, rate, rateUSD)}</span
              >
            </div>
          </div>
          <div class="section-title">Por ciudad</div>
          ${cities.map((c) => {
            const b = bud[c.id] || {
              accom: 0,
              transport: 0,
              food: 0,
              activities: 0,
              misc: 0,
            };
            const est = budgetTotal(b);
            const spent = getSpent(c.city);
            const p = est > 0 ? Math.min(100, (spent / est) * 100) : 0;
            return html`<div class="budget-city" key=${c.id}>
              <div
                style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"
              >
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:22px">${c.emoji}</span>
                  <div>
                    <div style="font-size:14px;font-weight:700">${c.city}</div>
                    <div style="font-size:11px;color:var(--text3)">
                      ${c.nights} noches · ${c.dates}
                    </div>
                  </div>
                </div>
                <div
                  style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"
                >
                  <div style="font-size:13px;font-weight:700;color:var(--blue)">
                    ${fmt(est, cur, rate, rateUSD)}
                  </div>
                  <button
                    class="btn btn-ghost btn-sm"
                    onClick=${() => openEd(c.id)}
                  >
                    ✏️ Editar
                  </button>
                </div>
              </div>
              <div class="progress-bar">
                <div
                  class="progress-fill"
                  style=${"width:" +
                  p +
                  "%;background:" +
                  (p < 60
                    ? "var(--green)"
                    : p < 85
                      ? "var(--amber)"
                      : "var(--red)")}
                ></div>
              </div>
              <div
                style="display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--text3)"
              >
                <span>Gastado: ${fmt(spent, cur, rate, rateUSD)}</span
                ><span>${p.toFixed(0)}%</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">
                ${[
                  ["🏨", b.accom, "Aloj."],
                  ["🚆", b.transport, "Transp."],
                  ["🍽️", b.food, "Comida"],
                  ["🎟️", b.activities, "Activ."],
                  ["📌", b.misc, "Extra"],

      // ══════════════════ SAVINGS ══════════════════
      function SavingsTab({
        savings,
        setSavings,
        savingsGoal,
        setSavingsGoal,
        cur,
        rate,
        rateUSD,
        extraRates,
      }) {
        const [showAdd, setShowAdd] = useState(false);
        const [editGoal, setEditGoal] = useState(false);
        const [goalInput, setGoalInput] = useState(String(savingsGoal));
        const [form, setForm] = useState({ name: "", amount: "", note: "" });
        const upd = (k, v) => setForm((p) => ({ ...p, [k]: v }));

        // Todo en COP internamente
        const totalSaved = savings.reduce(
          (s, a) => s + (parseFloat(a.amount) || 0),
          0,
        );
        const pct =
          savingsGoal > 0 ? Math.min(100, (totalSaved / savingsGoal) * 100) : 0;
        const falta = Math.max(0, savingsGoal - totalSaved);

        const saveGoal = () => {
          const v = parseInt(goalInput.replace(/\D/g, ""));
          if (v >= 0) {
            setSavingsGoal(v);
            setEditGoal(false);
          }
        };
        const addAccount = () => {
          if (!form.name || !form.amount) return;
          setSavings((p) => [
            ...p,
            { id: Date.now(), ...form, amount: parseFloat(form.amount) || 0 },
          ]);
          setForm({ name: "", amount: "", note: "" });
          setShowAdd(false);
        };
        const del = (id) => {
          if (confirm("¿Eliminar esta cuenta?"))
            setSavings((p) => p.filter((a) => a.id !== id));

        // Convertir COP a moneda activa
        const fmtCOP = (cop) => fmt(cop / rate, cur, rate, rateUSD, extraRates);

        return html`<div>

            <div class="page-title">💰 Ahorros</div>

                        <div>

                      $${(parseFloat(a.amount) || 0).toLocaleString("es")} COP
                    </div>
                    <button

                      style="color:var(--red);padding:2px 8px;font-size:11px"

                  </div>
                </div>
                <div class="progress-bar" style="margin-top:8px">
                  <div
                    class="progress-fill"
                    style=${"width:" +
                    Math.min(

                      savingsGoal > 0
                        ? ((parseFloat(a.amount) || 0) / savingsGoal) * 100
                        : 0,
                    ) +
                    "%;background:var(--green)"}
                  ></div>
                </div>
                <div style="font-size:10px;color:var(--text3);margin-top:4px">
                  ${savingsGoal > 0
                    ? (
                        ((parseFloat(a.amount) || 0) / savingsGoal) *
                        100
                      ).toFixed(1)

                  del total meta
                </div>
              </div>

          <!-- Modal agregar cuenta -->
          ${showAdd &&
          html`<div
            class="modal-overlay open"
            onClick=${(e) => {
              if (e.target.classList.contains("modal-overlay"))

          >
            <div class="modal">

      // ══════════════════ CHECKLIST ══════════════════
      function ChkTab({ chk, setChk }) {
        const [filter, setFilter] = useState("Todos");
        const [openCat, setOpenCat] = useState(null);
        const [showAdd, setShowAdd] = useState(false);
        const [newItem, setNewItem] = useState({
          cat: Object.keys(chk)[0],
          text: "",
          urgent: false,
        });
        const toggle = (cat, id) =>
          setChk((p) => ({
            ...p,
            [cat]: p[cat].map((i) =>
              i.id === id ? { ...i, done: !i.done } : i,
            ),
          }));
        const delItem = (cat, id) =>
          setChk((p) => ({ ...p, [cat]: p[cat].filter((i) => i.id !== id) }));
        const addItem = () => {
          if (!newItem.text) return;
          const item = {
            id: "u" + Date.now(),
            text: newItem.text,
            done: false,
            urgent: newItem.urgent,
          };
          setChk((p) => ({ ...p, [newItem.cat]: [...p[newItem.cat], item] }));
          setShowAdd(false);
          setNewItem((p) => ({ ...p, text: "", urgent: false }));
        };
        const total = Object.values(chk).reduce((s, c) => s + c.length, 0);
        const done = Object.values(chk).reduce(
          (s, c) => s + c.filter((i) => i.done).length,
          0,
        );
        const urgent = Object.values(chk).reduce(
          (s, c) => s + c.filter((i) => i.urgent && !i.done).length,
          0,
        );
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        return html`<div>
          <div class="page-header" style="padding-top:8px">
            <div class="page-title">✅ Checklist</div>
            <button
              class="btn btn-primary btn-sm"
              onClick=${() => setShowAdd(true)}
            >
              + Item
            </button>
          </div>
          <div class="card" style="margin-bottom:8px">
            <div
              style="display:flex;justify-content:space-between;margin-bottom:8px"
            >
              <div>
                <span style="font-size:28px;font-weight:900;color:var(--green)"
                  >${done}</span
                ><span style="font-size:14px;color:var(--text2)">
                  / ${total}</span
                >
              </div>
              <div style="text-align:right">
                ${urgent > 0
                  ? html`<div
                      style="font-size:12px;color:var(--red);font-weight:700"
                    >
                      🚨 ${urgent} urgentes
                    </div>`
                  : ""}
                <div style="font-size:12px;color:var(--text2)">
                  ${pct}% completado
                </div>
              </div>
            </div>
            <div class="progress-bar">
              <div
                class="progress-fill"
                style=${"width:" + pct + "%;background:var(--green)"}
              ></div>
            </div>
          </div>
          <div class="filter-row">
            ${["Todos", "Urgentes", "Pendientes", "Completados"].map(
              (f) =>
                html`<button
                  class=${"filter-chip" + (filter === f ? " active" : "")}
                  onClick=${() => setFilter(f)}
                >
                  ${f}
                </button>`,
            )}
          </div>
          ${Object.entries(chk).map(([cat, items]) => {
            let filtered = items;
            if (filter === "Urgentes")
              filtered = items.filter((i) => i.urgent && !i.done);
            if (filter === "Pendientes")
              filtered = items.filter((i) => !i.done);
            if (filter === "Completados")
              filtered = items.filter((i) => i.done);
            if (filtered.length === 0) return null;
            const catDone = filtered.filter((i) => i.done).length;
            const isOpen = openCat === cat;
            return html`<div key=${cat} style="margin:0 16px 8px">
              <button
                style="width:100%;background:var(--card);border:none;border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--text)"
                onClick=${() => setOpenCat(isOpen ? null : cat)}
              >
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:14px;font-weight:700">${cat}</span>
                  <span class="badge badge-blue"
                    >${catDone}/${filtered.length}</span
                  >
                  ${filtered.some((i) => i.urgent && !i.done)
                    ? html`<span class="badge badge-red">🚨</span>`
                    : ""}
                </div>
                <span style="color:var(--text3)">${isOpen ? "▲" : "▼"}</span>
              </button>
              ${isOpen &&
              html`<div
                style="background:var(--card);border-radius:0 0 12px 12px;padding:0 14px;margin-top:1px"
              >
                ${filtered.map(
                  (i) =>
                    html`<div class="toggle-row" key=${i.id}>
                      <div
                        style="display:flex;align-items:flex-start;gap:10px;flex:1"
                      >
                        <button
                          class=${"checkbox" + (i.done ? " checked" : "")}
                          onClick=${() => toggle(cat, i.id)}
                        >
                          ${i.done ? "✓" : ""}
                        </button>
                        <div style="flex:1">
                          <div
                            style=${"font-size:13px;font-weight:500;" +
                            (i.done
                              ? "text-decoration:line-through;color:var(--text3);"
                              : "")}
                          >
                            ${i.text}
                          </div>
                          ${i.urgent && !i.done
                            ? html`<span
                                class="badge badge-red"
                                style="margin-top:3px"
                                >🚨 Urgente</span
                              >`
                            : ""}
                        </div>
                      </div>
                      <button
                        class="btn-icon"
                        style="color:var(--red);margin-left:6px"
                        onClick=${() => delItem(cat, i.id)}
                      >
                        🗑️
                      </button>
                    </div>`,
                )}
              </div>`}
            </div>`;
          })}
          ${showAdd &&
          html`<div
            class="modal-overlay open"
            onClick=${(e) => {
              if (e.target.classList.contains("modal-overlay"))
                setShowAdd(false);
            }}
          >
            <div class="modal">
              <div class="modal-handle"></div>
              <div class="modal-header">
                <span class="modal-title">Nuevo ítem</span>
                <div style="display:flex;align-items:center;gap:8px">
                  <button class="btn btn-primary btn-sm" onClick=${addItem}>
                    Agregar</button
                  ><button class="btn-icon" onClick=${() => setShowAdd(false)}>
                    ✕
                  </button>
                </div>
              </div>
              <div class="modal-body">
                <div class="field">
                  <label class="label">Categoría</label
                  ><select
                    class="input"
                    value=${newItem.cat}
                    onChange=${(e) =>
                      setNewItem((p) => ({ ...p, cat: e.target.value }))}
                  >
                    ${Object.keys(chk).map(
                      (c) => html`<option value=${c}>${c}</option>`,
                    )}
                  </select>
                </div>
                <div class="field">
                  <label class="label">Descripción</label
                  ><input
                    class="input"
                    placeholder="Ej: Comprar adaptador europeo"
                    value=${newItem.text}
                    onInput=${(e) =>
                      setNewItem((p) => ({ ...p, text: e.target.value }))}
                  />
                </div>
                <div
                  style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px;background:var(--card2);border-radius:10px"
                >
                  <button
                    class=${"checkbox" + (newItem.urgent ? " checked" : "")}
                    onClick=${() =>
                      setNewItem((p) => ({ ...p, urgent: !p.urgent }))}
                  >
                    ${newItem.urgent ? "✓" : ""}
                  </button>
                  <div>
                    <div style="font-size:13px;font-weight:600">
                      Marcar como urgente
                    </div>
                    <div style="font-size:11px;color:var(--text3)">
                      Aparece en alertas del Inicio
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>`}
        </div>`;
      }

      // ══════════════════ DOCS ══════════════════
      function DocsTab({ docs, setDocs }) {
        const [filter, setFilter] = useState("Todos");
        const [showAdd, setShowAdd] = useState(false);
        const [viewing, setViewing] = useState(null);
        const [viewFile, setViewFile] = useState(null);
        const [form, setForm] = useState({
          title: "",
          category: "Vuelos",
          info: "",
          icon: "📄",
        });
        const fileRef = useRef();
        const cats = [
          "Todos",
          "Vuelos",
          "Alojamiento",
          "Seguros",
          "Actividades",
          "Emergencias",
          "Embajadas",
          "Pasaportes",
          "Supermercados",
          "Consejos",
          "Otro",
        ];
        const filtered =
          filter === "Todos" ? docs : docs.filter((d) => d.category === filter);

        const addDoc = () => {
          if (!form.title) return;
          setDocs((p) => [
            ...p,
            { ...form, id: "d" + Date.now(), type: "info" },
          ]);
          setShowAdd(false);
          setForm({ title: "", category: "Vuelos", info: "", icon: "📄" });
        };
        const handleFile = async (e) => {
          const files = e.target.files;
          if (!files || !files.length) return;
          for (const file of files) {
            const reader = new FileReader();
            reader.onload = async (ev) => {
              const id =
                "f" + Date.now() + Math.random().toString(36).substr(2, 5);
              await dbSave({
                id,
                data: ev.target.result,
                type: file.type,
                name: file.name,
              });
              setDocs((p) => [
                ...p,
                {
                  id,
                  title: file.name,
                  category: form.category || "Otro",
                  type: file.type.startsWith("image/") ? "image" : "pdf",
                  icon: file.type.startsWith("image/") ? "🖼️" : "📄",
                  info: file.name,
                  size: file.size,
                  date: new Date().toLocaleDateString("es"),
                },
              ]);
            };
            reader.readAsDataURL(file);
          }
          setShowAdd(false);
          e.target.value = "";
        };
        const viewDoc = async (doc) => {
          if (doc.type === "info") {
            setViewing(doc);
            return;
          }
          const f = await dbGet(doc.id).catch(() => null);
          if (f) setViewFile({ ...doc, data: f.data, mimeType: f.type });
          else
            alert(
              "Archivo no encontrado. Puede haberse borrado al limpiar el caché del navegador.",
            );
        };
        const delDoc = async (doc) => {
          if (!confirm("¿Eliminar?")) return;
          if (doc.type !== "info") await dbDel(doc.id).catch(() => {});
          setDocs((p) => p.filter((d) => d.id !== doc.id));
        };
        const fmtSize = (b) => {
          if (!b) return "";
          return b < 1048576
            ? (b / 1024).toFixed(1) + "KB"
            : (b / 1048576).toFixed(1) + "MB";
        };

        return html`<div>
          <div class="page-header" style="padding-top:8px">
            <div class="page-title">📁 Documentos</div>
            <button
              class="btn btn-primary btn-sm"
              onClick=${() => setShowAdd(true)}
            >
              + Agregar
            </button>
          </div>
          <div style="padding:0 16px 8px;font-size:12px;color:var(--text3)">
            Reservas, códigos de vuelo, PDFs y fotos del viaje
          </div>
          <div class="filter-row">
            ${cats.map(
              (c) =>
                html`<button
                  class=${"filter-chip" + (filter === c ? " active" : "")}
                  onClick=${() => setFilter(c)}
                >
                  ${c}
                </button>`,
            )}
          </div>
          <div style="padding:0 16px">
            ${filtered.length === 0
              ? html`<div class="empty">
                  <div class="empty-icon">📁</div>
                  <div>Sin documentos en esta categoría</div>
                </div>`
              : filtered.map(
                  (doc) =>
                    html`<div class="doc-row" key=${doc.id}>
                      <div class="doc-icon">${doc.icon || "📄"}</div>
                      <div
                        style="flex:1;min-width:0;cursor:pointer"
                        onClick=${() => viewDoc(doc)}
                      >
                        <div
                          style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px"
                        >
                          ${doc.title}
                        </div>
                        <div style="font-size:11px;color:var(--text3)">
                          ${doc.category}${doc.size
                            ? " · " + fmtSize(doc.size)
                            : ""}${doc.date ? " · " + doc.date : ""}
                        </div>
                        ${doc.type === "info" && doc.info
                          ? html`<div
                              style="font-size:12px;color:var(--blue);margin-top:2px;font-weight:600;word-break:break-all;white-space:normal"
                            >
                              ${doc.info.length > 80
                                ? doc.info.slice(0, 80) + "…"
                                : doc.info}
                            </div>`
                          : ""}
                      </div>
                      <button class="btn-icon" onClick=${() => viewDoc(doc)}>
                        👁️
                      </button>
                      <button
                        class="btn-icon"
                        style="color:var(--red)"
                        onClick=${() => delDoc(doc)}
                      >
                        🗑️
                      </button>
                    </div>`,
                )}
          </div>

          ${showAdd &&
          html`<div
            class="modal-overlay open"
            onClick=${(e) => {
              if (e.target.classList.contains("modal-overlay"))
                setShowAdd(false);
            }}
          >
            <div class="modal">
              <div class="modal-handle"></div>
              <div class="modal-header">
                <span class="modal-title">Agregar documento</span>
                <div style="display:flex;align-items:center;gap:8px">
                  <button class="btn btn-primary btn-sm" onClick=${addDoc}>
                    Guardar</button
                  ><button class="btn-icon" onClick=${() => setShowAdd(false)}>
                    ✕
                  </button>
                </div>
              </div>
              <div class="modal-body">
                <div class="field">
                  <label class="label">Categoría</label
                  ><select
                    class="input"
                    value=${form.category}
                    onChange=${(e) =>
                      setForm((p) => ({ ...p, category: e.target.value }))}
                  >
                    ${cats
                      .filter((c) => c !== "Todos")
                      .map((c) => html`<option value=${c}>${c}</option>`)}
                  </select>
                </div>
                <div
                  style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"
                >
                  <button
                    class="btn btn-ghost"
                    style="padding:16px;border-radius:14px;flex-direction:column;gap:6px;display:flex;align-items:center;border:2px dashed var(--border)"
                    onClick=${() => fileRef.current.click()}
                  >
                    <span style="font-size:28px">📎</span
                    ><span style="font-size:12px;font-weight:600"
                      >PDF o Foto</span
                    ><span style="font-size:10px;color:var(--text3)"
                      >Desde iPhone</span
                    >
                  </button>
                  <div
                    style="padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--card2);font-size:11px;color:var(--text3);display:flex;align-items:center;justify-content:center;text-align:center"
                  >
                    O completar el formulario abajo para guardar un dato de
                    texto
                  </div>
                </div>
                <div class="field">
                  <label class="label">Título</label
                  ><input
                    class="input"
                    placeholder="Ej: Reserva Hotel Praga"
                    value=${form.title}
                    onInput=${(e) =>
                      setForm((p) => ({ ...p, title: e.target.value }))}
                  />
                </div>
                <div class="field">
                  <label class="label">Dato / Código / Número</label
                  ><textarea
                    class="input"
                    placeholder="Número de reserva, código, teléfono, dirección..."
                    value=${form.info}
                    onInput=${(e) =>
                      setForm((p) => ({ ...p, info: e.target.value }))}
                  ></textarea>
                </div>
                <div class="field">
                  <label class="label">Ícono (emoji)</label
                  ><input
                    class="input"
                    value=${form.icon}
                    onInput=${(e) =>
                      setForm((p) => ({ ...p, icon: e.target.value }))}
                  />
                </div>
                <input
                  ref=${fileRef}
                  type="file"
                  accept="image/*,application/pdf"
                  multiple
                  style="display:none"
                  onChange=${handleFile}
                />
              </div>
            </div>
          </div>`}
          ${viewing &&
          html`<div
            class="modal-overlay open"
            onClick=${(e) => {
              if (e.target.classList.contains("modal-overlay"))
                setViewing(null);
            }}
          >
            <div class="modal">
              <div class="modal-handle"></div>
              <div class="modal-header">
                <span class="modal-title">${viewing.icon} ${viewing.title}</span
                ><button class="btn-icon" onClick=${() => setViewing(null)}>
                  ✕
                </button>
              </div>
              <div class="modal-body" style="padding-bottom:20px">
                <div
                  style="background:var(--card2);border-radius:12px;padding:14px;margin-bottom:10px"
                >
                  <div style="font-size:11px;color:var(--text3)">Categoría</div>
                  <div style="font-size:14px;font-weight:600">
                    ${viewing.category}
                  </div>
                </div>
                ${viewing.info &&
                html`<div
                  style="background:var(--card2);border-radius:12px;padding:14px"
                >
                  <div
                    style="font-size:11px;color:var(--text3);margin-bottom:6px"
                  >
                    Información
                  </div>
                  <div
                    style="font-size:16px;font-weight:700;color:var(--blue);word-break:break-all;line-height:1.5"
                  >
                    ${viewing.info}
                  </div>
                </div>`}
              </div>
            </div>
          </div>`}
          ${viewFile &&
          html`<div
            class="modal-overlay open"
            onClick=${(e) => {
              if (e.target.classList.contains("modal-overlay"))
                setViewFile(null);
            }}
          >
            <div class="modal" style="max-height:95vh">
              <div class="modal-handle"></div>
              <div class="modal-header">
                <span class="modal-title">${viewFile.title}</span
                ><button class="btn-icon" onClick=${() => setViewFile(null)}>
                  ✕
                </button>
              </div>
              <div class="modal-body" style="padding-bottom:20px">
                ${viewFile.type === "image"
                  ? html`<img
                      src=${viewFile.data}
                      alt=${viewFile.title}
                      style="width:100%;border-radius:12px;max-height:60vh;object-fit:contain"
                    />`
                  : html`<div style="text-align:center;padding:20px">
                      <div style="font-size:64px;margin-bottom:12px">📄</div>
                      <div
                        style="font-size:15px;font-weight:600;margin-bottom:16px"
                      >
                        ${viewFile.title}
                      </div>
                      <a
                        href=${viewFile.data}
                        download=${viewFile.title}
                        target="_blank"
                        style="display:inline-block;padding:12px 24px;background:var(--blue);color:#fff;border-radius:12px;text-decoration:none;font-weight:600"
                        >📥 Abrir / Descargar PDF</a
                      >
                    </div>`}
              </div>
            </div>
          </div>`}
        </div>`;
      }

      render(html`<${App} />`, document.getElementById("app"));
    </script>
  </body>
</html>
